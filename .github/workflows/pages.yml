name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check question bank
        run: node scripts/validate-questions.mjs
      - name: Check calculator maths
        run: node scripts/test-calculator.mjs
      - name: Check lesson widget maths
        run: node scripts/test-widgets.mjs
      - name: Check mental maths sprint
        run: node scripts/test-sprint.mjs

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp asset links with this commit
        # Each deploy gets new ?v= URLs, so browsers never mix a cached page with newer scripts or styles.
        run: sed -i "s/?v=dev\"/?v=${GITHUB_SHA::7}\"/g" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
