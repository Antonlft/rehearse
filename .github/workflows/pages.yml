name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check question bank
        run: node scripts/validate-questions.mjs
      - name: Check calculator maths
        run: node scripts/test-calculator.mjs
      - name: Check lesson widget maths
        run: node scripts/test-widgets.mjs
      - name: Check mental maths sprint
        run: node scripts/test-sprint.mjs

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp asset links with this commit
        # Each deploy gets new ?v= URLs, so browsers never mix a cached page with newer scripts or styles.
        run: sed -i "s/?v=dev\"/?v=${GITHUB_SHA::7}\"/g" site/index.html
      - name: Make the formula sheet PDF
        # Chrome (already installed on GitHub's machine) prints the formula sheet to site/formula-sheet.pdf, which the
        # sheet's "Open as PDF" link opens. Rebuilt on every deploy, so it always matches the lessons.
        run: |
          python3 -m http.server 8000 --directory site >/dev/null 2>&1 &
          sleep 2
          google-chrome --headless --no-sandbox --disable-gpu --no-pdf-header-footer --virtual-time-budget=8000 \
            --print-to-pdf=site/formula-sheet.pdf "http://localhost:8000/?page=formulas"
          test -s site/formula-sheet.pdf
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Wait for GitHub to register the upload
        # Since Nov 2026 the deploy step sometimes looks for the upload before GitHub lists it ("No artifacts named
        # github-pages were found"). A short pause gives GitHub time to catch up.
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
